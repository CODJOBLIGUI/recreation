{% extends 'catalogue/base.html' %}
{% load static text_extras %}

{% block content %}

<article class="collection-detail section">
    <div class="container container--narrow">
        <header class="collection-detail__header">
            {% if collection.logo %}
            <div class="collection-detail__logo">
                <img src="{{ collection.logo.url }}" alt="{{ collection.nom }}">
            </div>
            {% endif %}
            <h1 class="collection-detail__title">{{ collection.nom }}</h1>
        </header>

        {% if collection.description %}
        <div class="collection-detail__content">
            {{ collection.description|unescape|safe }}
        </div>
        {% endif %}

        {% if collection.image %}
        <div class="collection-detail__hero">
            <img src="{{ collection.image.url }}" alt="{{ collection.nom }}">
        </div>
        {% endif %}
    </div>
</article>

{% endblock %}
